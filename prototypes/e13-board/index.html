<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wyrdturn: board fight</title>
    <style>
      :root {
        --ink: #f1ead8;
        --dim: #b7ad98;
        --panel: rgba(18, 14, 10, 0.86);
        --edge: rgba(240, 210, 150, 0.28);
        --blue: #5ab0ff;
        --red: #ff5a48;
        --gold: #ffd166;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font:
          14px/1.35 "Segoe UI",
          system-ui,
          sans-serif;
        color: var(--ink);
        user-select: none;
      }
      canvas {
        display: block;
      }
      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 8px 12px;
      }
      #status {
        left: 12px;
        top: 12px;
        min-width: 230px;
      }
      #status h1 {
        font-size: 16px;
        margin: 0 0 2px;
      }
      #phase {
        font-weight: 700;
        font-size: 18px;
      }
      #phase.enemy {
        color: var(--red);
      }
      #phase.player {
        color: var(--blue);
      }
      .pips span {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin-right: 4px;
        background: #3a3328;
        border: 1px solid #6a5a40;
        vertical-align: middle;
      }
      .pips span.on {
        background: var(--gold);
        box-shadow: 0 0 6px var(--gold);
      }
      #hint {
        color: var(--dim);
        font-size: 12px;
        margin-top: 4px;
        max-width: 280px;
      }
      #legend {
        right: 12px;
        top: 12px;
        font-size: 12px;
      }
      #legend div {
        margin: 2px 0;
      }
      #legend i {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -2px;
      }
      #hand {
        position: fixed;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .card {
        width: 118px;
        height: 132px;
        background: linear-gradient(#3a2e20, #241c14);
        border: 2px solid #7a6440;
        border-radius: 9px;
        padding: 6px 8px;
        box-sizing: border-box;
        cursor: pointer;
        position: relative;
        transition: transform 0.08s;
      }
      .card:hover {
        transform: translateY(-6px);
      }
      .card.sel {
        border-color: var(--gold);
        box-shadow: 0 0 12px var(--gold);
        transform: translateY(-10px);
      }
      .card.off {
        opacity: 0.45;
      }
      .card b {
        display: block;
        font-size: 14px;
        margin-right: 22px;
      }
      .card .cost {
        position: absolute;
        right: 6px;
        top: 5px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--gold);
        color: #2a1c08;
        font-weight: 800;
        text-align: center;
        line-height: 22px;
      }
      .card .txt {
        font-size: 11.5px;
        color: var(--dim);
        margin-top: 4px;
      }
      .card .cat {
        position: absolute;
        bottom: 5px;
        left: 8px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c8a060;
      }
      .card .key {
        position: absolute;
        bottom: 5px;
        right: 8px;
        font-size: 10px;
        color: #8a7a60;
      }
      #unit {
        left: 12px;
        bottom: 12px;
        width: 250px;
      }
      #unit button,
      #end {
        font: inherit;
        color: var(--ink);
        background: #3a2e20;
        border: 1px solid #8a7040;
        border-radius: 6px;
        padding: 5px 8px;
        margin: 3px 3px 0 0;
        cursor: pointer;
      }
      #unit button.sel {
        border-color: var(--gold);
        box-shadow: 0 0 8px var(--gold);
      }
      #unit button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #unit .ab small {
        display: block;
        font-size: 11px;
        color: var(--dim);
      }
      #end {
        position: fixed;
        right: 14px;
        bottom: 14px;
        font-size: 18px;
        font-weight: 700;
        padding: 12px 20px;
        background: #6a2a1a;
        border-color: #ff9a6a;
      }
      #end:disabled {
        opacity: 0.4;
      }
      #preview {
        position: fixed;
        left: 50%;
        bottom: 154px;
        transform: translateX(-50%);
        background: rgba(40, 30, 8, 0.92);
        border: 1px solid var(--gold);
        border-radius: 6px;
        padding: 5px 12px;
        font-weight: 600;
        white-space: nowrap;
        display: none;
      }
      #banner {
        position: fixed;
        left: 50%;
        top: 22%;
        transform: translateX(-50%);
        font-size: 30px;
        font-weight: 800;
        text-shadow: 0 2px 8px #000;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .ul {
        position: absolute;
        transform: translate(-50%, -100%);
        text-align: center;
        font-size: 11px;
        white-space: nowrap;
        text-shadow: 0 1px 2px #000;
      }
      .ul .hp {
        font-size: 11px;
        font-weight: 700;
      }
      .ul .nm {
        font-size: 12px;
        font-weight: 700;
        color: #fff;
      }
      .ul .bar {
        display: inline-block;
        width: 34px;
        height: 5px;
        background: #200;
        border: 1px solid #000;
        margin-right: 3px;
        vertical-align: 1px;
      }
      body.intro #hand,
      body.intro #unit,
      body.intro #end,
      body.intro #legend,
      body.intro #labels {
        opacity: 0;
      }
      #hand,
      #unit,
      #end,
      #legend,
      #labels {
        transition: opacity 0.5s;
      }
      .ul .bar i {
        display: block;
        height: 100%;
      }
      .ul .intent {
        display: inline-block;
        font-size: 10.5px;
        background: rgba(120, 20, 10, 0.9);
        border: 1px solid var(--red);
        border-radius: 4px;
        padding: 0 4px;
        font-weight: 700;
        margin-bottom: 1px;
      }
      .tn {
        position: absolute;
        transform: translate(-50%, -50%);
        font-weight: 800;
        font-size: 15px;
        text-shadow:
          0 0 3px #000,
          0 0 3px #000;
      }
      .float {
        position: absolute;
        transform: translate(-50%, -50%);
        font-weight: 900;
        font-size: 20px;
        text-shadow:
          0 0 4px #000,
          0 0 4px #000;
      }
      #over {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.55);
        font-size: 40px;
        font-weight: 800;
      }
      #over a {
        font-size: 18px;
        color: var(--gold);
        margin: 6px;
      }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <div id="status" class="panel">
      <h1 id="title"></h1>
      <div><span id="phase"></span> <span id="round" style="color: var(--dim)"></span></div>
      <div class="pips" id="energy"></div>
      <div id="hint"></div>
    </div>
    <div id="legend" class="panel">
      <div><i style="background: #ff5a48"></i>enemy hits next turn (number = damage)</div>
      <div><i style="background: #5ab0ff"></i>where the selected unit can move</div>
      <div><i style="background: #ffd166"></i>card or ability target</div>
      <div><i style="background: #ff8a20"></i>fire: 3 on entry and at round end</div>
      <div><i style="background: #8a5a1c"></i>oil: fire on it blazes (5)</div>
      <div><i style="background: #6ad04a"></i>poison: 2 at round end, spreads</div>
      <div><i style="background: none; border: 2px solid #ffd166"></i>ward: -2 damage per hit</div>
    </div>
    <div id="unit" class="panel"></div>
    <div id="preview"></div>
    <div id="hand"></div>
    <button id="end">End turn (E)</button>
    <div id="banner"></div>
    <div id="over"></div>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
