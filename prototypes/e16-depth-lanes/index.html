<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Depth Lanes</title>
    <style>
      :root {
        --ink: #f4ead8;
        --dim: #b8ab94;
        --panel: rgba(24, 19, 15, 0.84);
        --edge: #6a5a44;
        --gold: #ffd65a;
        --red: #ff5a48;
        --green: #7dff9a;
        --blue: #8fd0ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120e0b;
        overflow: hidden;
        color: var(--ink);
        font:
          14px/1.3 "Trebuchet MS",
          "Segoe UI",
          sans-serif;
        user-select: none;
      }
      canvas {
        display: block;
      }
      .layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: #3a2e22;
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 4px 9px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #4e3d2b;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      button.sel {
        border-color: var(--gold);
        background: #4a3a18;
      }
      select {
        font: inherit;
        color: var(--ink);
        background: #3a2e22;
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 3px 6px;
      }
      /* top left, under the fight select: the middle of the screen belongs to the far enemies */
      #top {
        position: fixed;
        top: 46px;
        left: 12px;
        max-width: 300px;
      }
      #banner {
        font-size: 21px;
        font-weight: bold;
        text-shadow: 0 2px 6px #000;
      }
      #banner.enemy {
        color: var(--red);
      }
      #sub {
        color: var(--dim);
        font-size: 13px;
        text-shadow: 0 1px 3px #000;
      }
      #wave {
        margin-top: 3px;
        font-size: 12px;
        color: #ffc8a0;
        text-shadow: 0 1px 3px #000;
      }
      #fightbar {
        position: fixed;
        top: 10px;
        left: 12px;
        display: flex;
        gap: 6px;
      }
      #legend {
        position: fixed;
        top: 10px;
        right: 12px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 5px 9px;
        font-size: 11px;
        line-height: 1.5;
      }
      .sw {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      /* labels over units and cells */
      .ul {
        position: absolute;
        transform: translate(-50%, -100%);
        text-align: center;
        white-space: nowrap;
      }
      .intent {
        display: inline-block;
        margin-bottom: 3px;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgba(70, 14, 10, 0.92);
        border: 1px solid #d84a36;
        font-size: 12px;
        font-weight: bold;
        color: #ffe0d0;
      }
      .intent.calm {
        background: rgba(30, 30, 40, 0.85);
        border-color: #7a7a9a;
        color: #d8d8f0;
        font-weight: normal;
      }
      .intent.off {
        background: rgba(40, 40, 40, 0.9);
        border-color: #888;
        color: #aaa;
        text-decoration: line-through;
      }
      .hp {
        position: relative;
        width: 64px;
        height: 9px;
        margin: 0 auto;
        background: #2a0e0c;
        border: 1px solid #000;
        border-radius: 3px;
        overflow: hidden;
      }
      .hp i {
        position: absolute;
        inset: 0 auto 0 0;
        background: linear-gradient(#e85a48, #a8281c);
      }
      .ally .hp i {
        background: linear-gradient(#78d860, #3a8a2a);
      }
      .hp b {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(255, 240, 200, 0.8);
      }
      .uname {
        font-size: 11px;
        color: var(--dim);
        text-shadow: 0 1px 2px #000;
      }
      .ul button {
        margin-top: 2px;
        padding: 1px 7px;
        font-size: 11px;
        pointer-events: auto;
      }
      .dmg {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 1px 6px;
        border-radius: 5px;
        background: rgba(200, 20, 10, 0.88);
        color: #fff;
        font-weight: bold;
        font-size: 15px;
        box-shadow: 0 0 10px #f008;
      }
      .dmg.lob {
        background: rgba(130, 40, 160, 0.9);
      }
      .pop {
        position: absolute;
        transform: translate(-50%, -50%);
        font-weight: bold;
        font-size: 22px;
        text-shadow:
          0 2px 4px #000,
          0 0 3px #000;
        animation: pop 1.1s ease-out forwards;
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -30%) scale(0.6);
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -60%) scale(1.15);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -160%) scale(1);
        }
      }
      #hurt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 160px 40px rgba(255, 0, 0, 0.55);
        opacity: 0;
        transition: opacity 0.4s;
      }
      /* bottom bar */
      #bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 8px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 12px;
        pointer-events: none;
      }
      #bottom > * {
        pointer-events: auto;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 12.5px;
      }
      #wolfpanel {
        width: 190px;
      }
      #wolfpanel .row {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      #wolfpanel button {
        padding: 3px 7px;
        font-size: 12px;
      }
      .ph {
        font-weight: bold;
        color: var(--gold);
        margin-bottom: 2px;
      }
      #center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #herobar {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 4px 10px;
      }
      #herobar .hp {
        width: 160px;
        height: 13px;
      }
      #herohp {
        font-weight: bold;
        min-width: 48px;
      }
      #hand {
        display: flex;
        gap: 7px;
        align-items: flex-end;
      }
      .card {
        width: 112px;
        height: 150px;
        box-sizing: border-box;
        padding: 6px 7px;
        border-radius: 9px;
        background: linear-gradient(#4a3c2c, #2a2018);
        border: 2px solid #8a7050;
        box-shadow: 0 4px 10px #000a;
        cursor: pointer;
        transition: transform 0.12s;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .card:hover {
        transform: translateY(-8px);
      }
      .card.sel {
        transform: translateY(-16px);
        border-color: var(--gold);
        box-shadow: 0 0 16px #ffd65a88;
      }
      .card.off {
        filter: grayscale(0.85) brightness(0.6);
      }
      .cost {
        position: absolute;
        top: -8px;
        left: -8px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: radial-gradient(#ffe08a, #c8781c);
        color: #3a1c00;
        font-weight: bold;
        text-align: center;
        line-height: 24px;
        border: 2px solid #5a3a10;
      }
      .cname {
        font-weight: bold;
        font-size: 13px;
        text-align: center;
        margin: 0 0 3px 8px;
      }
      .ctext {
        font-size: 10.5px;
        color: #e8dcc4;
        flex: 1;
      }
      .reach {
        display: grid;
        grid-template-columns: repeat(3, 9px);
        gap: 1px;
        justify-content: center;
        margin: 1px 0 4px;
      }
      .reach i {
        width: 9px;
        height: 6px;
        background: #1a1410;
        border: 1px solid #4a3a2a;
      }
      .reach i.r {
        background: var(--green);
      }
      .reach i.h {
        background: var(--gold);
      }
      .reach i.p {
        background: #5a7aa8;
      }
      #energy {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: radial-gradient(#ffe08a, #c8781c);
        border: 3px solid #5a3a10;
        color: #3a1c00;
        font-size: 22px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        line-height: 1;
      }
      #energy small {
        font-size: 9px;
      }
      #handrow {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      #steps {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
        font-size: 11px;
        color: var(--dim);
      }
      #right {
        width: 250px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #end {
        font-size: 17px;
        font-weight: bold;
        padding: 10px;
        background: linear-gradient(#8a3a22, #5a1e10);
        border: 2px solid #c8603a;
        border-radius: 10px;
      }
      #preview {
        min-height: 54px;
        max-height: 190px;
        overflow: hidden;
      }
      .ev {
        margin: 1px 0;
      }
      .ev.bad {
        color: #ff9a80;
      }
      .ev.good {
        color: #b0ffb0;
      }
      .ev.combo {
        color: #ffb060;
        font-weight: bold;
      }
      .help {
        color: var(--dim);
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
      }
      #overlay .box {
        background: var(--panel);
        border: 2px solid var(--gold);
        border-radius: 12px;
        padding: 18px 30px;
        text-align: center;
      }
      #overlay h1 {
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div class="layer" id="cells"></div>
    <div class="layer" id="labels"></div>
    <div class="layer" id="pops"></div>
    <div id="hurt"></div>
    <div id="top">
      <div id="banner"></div>
      <div id="sub"></div>
      <div id="wave"></div>
    </div>
    <div id="fightbar">
      <select id="fight"></select>
      <button id="restart">Restart</button>
    </div>
    <div id="legend">
      <div>
        <span class="sw" style="background: #ff3a2a"></span>red cell: will be hit (number = damage)
      </div>
      <div><span class="sw" style="background: #ff8a3a"></span>fire 2 · blaze 3 a round</div>
      <div>
        <span class="sw" style="background: #2a1c10; border: 1px solid #a08060"></span>oil: fire on
        it blazes
      </div>
      <div><span class="sw" style="background: #bfe8ff"></span>ice: a walker skips a move</div>
      <div><span class="sw" style="background: #8ae05a"></span>poison 1 a round</div>
      <div><span class="sw" style="background: #7ac8ff"></span>ward: hits there deal 2 less</div>
    </div>
    <div id="bottom">
      <div id="wolfpanel" class="panel"></div>
      <div id="center">
        <div id="herobar">
          <span>Hero</span>
          <div class="hp" id="herohpbar"><i></i><b></b></div>
          <span id="herohp"></span>
        </div>
        <div id="handrow">
          <div id="steps">
            <div id="energy"></div>
            <div>
              <button id="stepL" title="Step left (1 energy)">◀</button>
              <button id="stepR" title="Step right (1 energy)">▶</button>
            </div>
            <div>step 1</div>
          </div>
          <div id="hand"></div>
        </div>
      </div>
      <div id="right">
        <button id="end">End turn</button>
        <div id="preview" class="panel"></div>
      </div>
    </div>
    <div id="overlay">
      <div class="box">
        <h1 id="otitle"></h1>
        <div id="otext"></div>
        <p><button id="onext"></button> <button id="oagain">Restart</button></p>
      </div>
    </div>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
