<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>e18 up-front autobattler</title>
    <style>
      :root {
        --ink: #f4ead8;
        --dim: #b8ab94;
        --panel: rgba(24, 19, 15, 0.9);
        --edge: #6a5a44;
        --gold: #ffd65a;
        --red: #ff5a48;
        --green: #7dff9a;
        --blue: #8fd0ff;
        --fire: #ff8a3a;
        --poison: #8ae05a;
        --oil: #c0a070;
        --ice: #bfe8ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120e0b;
        overflow: hidden;
        color: var(--ink);
        font:
          14px/1.3 "Trebuchet MS",
          "Segoe UI",
          sans-serif;
        user-select: none;
      }
      canvas {
        display: block;
      }
      .layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .ui {
        pointer-events: auto;
      }
      button,
      select {
        font: inherit;
        color: var(--ink);
        background: #3a2e22;
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 4px 9px;
        cursor: pointer;
      }
      button:hover {
        background: #4a3a2a;
      }
      button.on {
        background: #6a5222;
        border-color: var(--gold);
        color: #fff4d0;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.big {
        font-size: 18px;
        font-weight: bold;
        padding: 8px 22px;
        background: #7a3a1a;
        border-color: #e8a050;
      }
      button.big:hover {
        background: #9a4a22;
      }
      #topleft {
        position: fixed;
        top: 10px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
      }
      #title {
        font-size: 18px;
        font-weight: bold;
        text-shadow: 0 2px 6px #000;
      }
      #sub {
        color: var(--dim);
        font-size: 13px;
        max-width: 560px;
        text-shadow: 0 1px 3px #000;
      }
      .scoutab {
        margin: 3px auto 0;
        padding: 3px 6px;
        border-radius: 5px;
        background: rgba(40, 12, 10, 0.85);
        border: 1px solid #8a3a2e;
        font-size: 11px;
        line-height: 1.3;
        text-align: left;
        white-space: normal;
        width: 140px;
      }
      .scoutab b {
        color: #ffc0a8;
      }
      #top {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
      }
      #clock {
        font-size: 26px;
        font-weight: bold;
        text-shadow: 0 2px 6px #000;
      }
      #clock .dark {
        color: #c8a0ff;
        font-size: 14px;
        display: block;
      }
      #speed {
        position: fixed;
        top: 10px;
        right: 12px;
        display: flex;
        gap: 6px;
      }
      #banner {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 20px;
        font-weight: bold;
        color: var(--gold);
        text-shadow: 0 2px 8px #000;
        white-space: nowrap;
        transition: opacity 0.4s;
      }
      /* unit labels */
      .ulabel {
        position: absolute;
        transform: translate(-50%, -100%);
        text-align: center;
        white-space: nowrap;
      }
      .uname {
        font-size: 12px;
        font-weight: bold;
        text-shadow:
          0 1px 3px #000,
          0 0 2px #000;
      }
      .ulabel.sel .uname {
        color: var(--gold);
      }
      .hpbar {
        position: relative;
        width: 84px;
        height: 12px;
        margin: 2px auto 0;
        background: #2a0e0c;
        border: 1px solid #000;
        border-radius: 3px;
        overflow: hidden;
      }
      .hpfill {
        position: absolute;
        inset: 0 auto 0 0;
        background: linear-gradient(#e85a48, #a8281c);
      }
      .P .hpfill {
        background: linear-gradient(#78d860, #3a8a2a);
      }
      .hptxt {
        position: absolute;
        inset: 0;
        font-size: 10px;
        line-height: 12px;
        font-weight: bold;
        text-shadow:
          0 0 2px #000,
          0 0 2px #000;
      }
      .cds {
        display: flex;
        gap: 2px;
        justify-content: center;
        margin-top: 2px;
      }
      .cd {
        width: 26px;
        height: 4px;
        background: #0008;
        border-radius: 2px;
        overflow: hidden;
      }
      .cd i {
        display: block;
        height: 100%;
        background: var(--blue);
      }
      .E .cd i {
        background: #ff9a7a;
      }
      .tag {
        display: inline-block;
        margin: 1px 2px 0;
        padding: 0 4px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: bold;
        background: #333;
      }
      .shield {
        background: #4a6a9a;
      }
      /* slot labels on the floor */
      .slabel {
        position: absolute;
        transform: translate(-50%, 0);
        text-align: center;
        white-space: nowrap;
        font-size: 11px;
      }
      .snum {
        display: inline-block;
        width: 18px;
        height: 18px;
        line-height: 18px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        font-weight: bold;
        color: var(--dim);
      }
      .aim {
        display: block;
        margin-top: 2px;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(90, 16, 10, 0.85);
        border: 1px solid #c8402e;
        color: #ffe0d0;
        font-weight: bold;
      }
      .hz {
        display: inline-block;
        margin: 2px 1px 0;
        padding: 0 4px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: bold;
        color: #111;
      }
      .hz.fire {
        background: var(--fire);
      }
      .hz.oil {
        background: var(--oil);
      }
      .hz.poison {
        background: var(--poison);
      }
      .hz.ward {
        background: var(--blue);
      }
      .hz.ice {
        background: var(--ice);
      }
      .pop {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 20px;
        font-weight: bold;
        text-shadow:
          0 2px 4px #000,
          0 0 3px #000;
        animation: rise 1.1s ease-out forwards;
        pointer-events: none;
        white-space: nowrap;
      }
      .pop.small {
        font-size: 13px;
        color: #fff;
        opacity: 0.9;
      }
      @keyframes rise {
        from {
          transform: translate(-50%, -50%);
          opacity: 1;
        }
        to {
          transform: translate(-50%, -150%);
          opacity: 0;
        }
      }
      /* panels */
      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 10px 12px;
        box-shadow: 0 6px 20px #0009;
      }
      h3 {
        margin: 0 0 6px;
        font-size: 13px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--gold);
      }
      #setup {
        left: 12px;
        right: 12px;
        bottom: 10px;
        display: grid;
        grid-template-columns: 1.6fr 0.9fr 1fr auto;
        gap: 14px;
        align-items: start;
      }
      .skills {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
      }
      .skill {
        text-align: left;
        padding: 4px 7px;
        font-size: 12px;
        line-height: 1.25;
        min-height: 40px;
      }
      .skill b {
        font-size: 13px;
      }
      .skill .k {
        color: var(--dim);
        font-size: 11px;
      }
      .skill .d {
        color: var(--dim);
        font-size: 11px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .opt {
        font-size: 12px;
        text-align: left;
      }
      .why {
        color: var(--dim);
        font-size: 12px;
        margin-top: 6px;
        max-width: 330px;
      }
      #go {
        align-self: center;
        text-align: center;
      }
      #scout {
        right: 12px;
        top: 52px;
        width: 330px;
        max-height: calc(100vh - 330px);
        overflow: auto;
      }
      .enemy {
        border-top: 1px solid #4a3e30;
        padding: 5px 0;
        font-size: 12px;
      }
      .enemy b {
        font-size: 13px;
      }
      .enemy .ab {
        color: var(--dim);
        margin-left: 8px;
      }
      .phasebox {
        background: #3a1a2a;
        border: 1px solid #a05080;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 6px;
        font-size: 12px;
      }
      #result,
      #doors,
      #reward {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(980px, calc(100vw - 40px));
        max-height: calc(100vh - 40px);
        overflow: auto;
      }
      #result h2,
      #doors h2,
      #reward h2 {
        margin: 0 0 4px;
        font-size: 24px;
      }
      .win {
        color: var(--green);
      }
      .loss {
        color: var(--red);
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr 1.1fr;
        gap: 16px;
        margin-top: 8px;
      }
      .bar {
        display: grid;
        grid-template-columns: 1fr 120px 34px;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        margin: 2px 0;
      }
      .bar .b {
        height: 9px;
        border-radius: 3px;
        background: var(--green);
      }
      .bar.e .b {
        background: var(--red);
      }
      .bar .n {
        text-align: right;
        font-weight: bold;
      }
      .moment {
        font-size: 12px;
        padding: 2px 4px;
        border-radius: 4px;
        cursor: pointer;
      }
      .moment:hover {
        background: #4a3a2a;
      }
      .moment .t {
        color: var(--dim);
        display: inline-block;
        width: 46px;
      }
      .moment.fall {
        color: #ffb0a0;
      }
      .moment.kill {
        color: #c8f0b0;
      }
      .moment.combo,
      .moment.charm {
        color: var(--gold);
      }
      .moment.dark {
        color: #c8a0ff;
      }
      .change {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #22301e;
        border: 1px solid #5a8a4a;
        font-size: 13px;
      }
      .change.lost {
        background: #301e1e;
        border-color: #8a4a4a;
      }
      .verdict {
        font-size: 14px;
        margin: 4px 0;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        justify-content: flex-end;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        margin-top: 10px;
      }
      .card {
        text-align: left;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.4;
      }
      .card.picked {
        border-color: var(--gold);
        background: #5a4422;
      }
      svg text {
        fill: var(--dim);
        font-size: 10px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="canvas"></div>
    <div class="layer" id="slots"></div>
    <div class="layer" id="labels"></div>
    <div class="layer" id="pops"></div>
    <div id="topleft" class="ui">
      <div>
        <div id="title"></div>
        <div id="sub"></div>
      </div>
      <select id="pickfight" title="Choose a fight"></select>
    </div>
    <div id="top"><div id="clock"></div></div>
    <div id="banner"></div>
    <div id="speed" class="ui hidden">
      <button data-speed="1">1x</button>
      <button data-speed="2">2x</button>
      <button id="skip">Skip</button>
    </div>
    <div id="setup" class="panel ui hidden"></div>
    <div id="result" class="panel ui hidden"></div>
    <div id="doors" class="panel ui hidden"></div>
    <div id="reward" class="panel ui hidden"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
